[project]
name = "arcade-jukebox"
version = "0.1.0"
description = "A graphical jukebox for arcade cabinets, powered by YouTube Music"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pygame-ce>=2.5",
    "ytmusicapi>=1.10",
    "yt-dlp>=2025.1.1",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jukebox = "jukebox.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jukebox*"]

[tool.setuptools.package-data]
jukebox = ["assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
